<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Reza | Réservez restaurants, soins et activités</title>
  <meta name="description" content="Réservez en ligne vos restaurants, soins bien-être et activités près de chez vous sur Reza.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://client.booktareza.com/">
  <meta property="og:site_name" content="Reza">
  <meta property="og:title" content="Reza | Réservez restaurants, soins et activités">
  <meta property="og:description" content="Réservez en ligne vos restaurants, soins bien-être et activités près de chez vous sur Reza.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://client.booktareza.com/">

  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/assets/images/logo.png?v=1">
  <link rel="shortcut icon" type="image/png" href="/assets/images/logo.png?v=1">
  <link rel="apple-touch-icon" href="/assets/images/logo.png?v=1">
  <script>
    // Dark mode before first paint (no light flash). Kept in sync by ThemeService.
    (function () {
      try {
        var t = localStorage.getItem('reza_client.theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') { document.documentElement.classList.add('app-dark'); document.documentElement.style.colorScheme = 'dark'; }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
