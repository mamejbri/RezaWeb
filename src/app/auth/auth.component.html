<main class="auth-page">
  <section class="auth-panel">
    <h1>{{ 'auth.title' | t }}</h1>

    <form class="auth-form" (ngSubmit)="login()">
      <label class="auth-field">
        <input type="email" name="email" [(ngModel)]="email" [placeholder]="'auth.email' | t" autocomplete="email" />
      </label>

      <label class="auth-field">
        <input type="password" name="password" [(ngModel)]="password" [placeholder]="'auth.password' | t"
          autocomplete="current-password" />
      </label>

      <a class="auth-link" routerLink="/forgot-password">{{ 'auth.forgot' | t }}</a>

      @if (errorMessage) {
      <p class="auth-error">{{ errorMessage }}</p>
      }

      <button class="auth-button" type="submit" [disabled]="loading">
        {{ (loading ? 'auth.loggingIn' : 'auth.login') | t }}
      </button>
    </form>

    <div class="auth-divider" aria-hidden="true">
      <span></span>
      <strong>{{ 'common.or' | t }}</strong>
      <span></span>
    </div>

    <div class="auth-signup">
      <p>{{ 'auth.newOnReza' | t }}</p>
      <a class="auth-signup__button" routerLink="/register">{{ 'auth.createAccount' | t }}</a>
    </div>
  </section>
</main>
