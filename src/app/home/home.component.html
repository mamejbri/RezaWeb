<main class="home-page">
  <section class="hero-section">
    <header class="hero-header">
      <span class="hero-header__accent" aria-hidden="true"></span>
      <h1>{{ 'home.title' | t }}</h1>
      <p>{{ 'home.subtitle' | t }}</p>
    </header>

    <div class="hero-cards">
      @for (card of featureCards; track card.type) {
      <a class="hero-card" routerLink="/recherche" [queryParams]="{ type: card.type }">
        <img [src]="card.image" [alt]="card.title | t" />
        <span class="hero-card__content">
          <span class="hero-card__text">
            <span class="hero-card__title">{{ card.title | t }}</span>
            <span class="hero-card__tagline">{{ 'home.tagline.' + card.type | t }}</span>
          </span>
          <svg class="hero-card__chevron" width="26" height="26" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </span>
      </a>
      }
    </div>
  </section>
</main>
