<main class="recherche-page">
  <section class="recherche-hero" [style.background-image]="'url(' + typeConfig.image + ')'">
    <div class="recherche-hero__overlay"></div>

    <div class="recherche-hero__content">
      <h1>{{ 'search.heroTitle' | t }}</h1>
      <p class="recherche-hero__tagline">
        <span>{{ 'search.fast' | t }}</span>
        <span class="recherche-hero__dot" aria-hidden="true"></span>
        <span>{{ 'search.simple' | t }}</span>
        <span class="recherche-hero__dot" aria-hidden="true"></span>
        <span>{{ 'search.allDay' | t }}</span>
      </p>

      <form class="recherche-search" (ngSubmit)="submitSearch()">
        <input
          type="text"
          name="search"
          [placeholder]="'search.placeholder' | t"
          [(ngModel)]="searchText"
          autocomplete="off"
        />
        <button type="submit" class="recherche-search__button" [attr.aria-label]="'common.search' | t">
          <span class="recherche-search__icon" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </section>

  <section class="recherche-cities">
    <h2>{{ 'search.chooseCity' | t }}</h2>

    @if (citiesLoading) {
    <p class="recherche-cities__status">{{ 'search.loadingCities' | t }}</p>
    } @else {
    <div class="recherche-cities__grid">
      @for (city of cities; track city) {
      <button type="button" class="recherche-city-chip" (click)="selectCity(city)">{{ city }}</button>
      }
    </div>
    }

    <button type="button" class="recherche-skip" (click)="skipToAllResults()">
      {{ 'search.seeAll' | t }}
    </button>
  </section>
</main>
