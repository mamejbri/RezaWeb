<main class="reset-page">
  <section class="reset-panel">
    <h1>{{ 'reset.title' | t }}</h1>
    <p class="reset-copy">{{ 'reset.copy' | t }}</p>

    <form class="reset-form" (ngSubmit)="resetPassword()">
      @if (!token) {
      <label class="reset-field">
        <input type="text" name="token" [(ngModel)]="token" [placeholder]="'reset.token' | t" autocomplete="off"
          required />
      </label>
      }

      <label class="reset-field">
        <input type="password" name="newPassword" [(ngModel)]="newPassword" [placeholder]="'reset.newPassword' | t"
          autocomplete="new-password" required />
      </label>

      <label class="reset-field">
        <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword"
          [placeholder]="'reset.confirmPassword' | t" autocomplete="new-password" required />
      </label>

      @if (errorMessage) {
      <p class="reset-error">{{ errorMessage }}</p>
      }

      @if (successMessage) {
      <p class="reset-success">{{ successMessage }}</p>
      }

      <button class="reset-button" type="submit" [disabled]="loading">
        {{ (loading ? 'reset.resetting' : 'reset.reset') | t }}
      </button>
    </form>

    <a class="reset-link" routerLink="/auth">{{ 'forgot.backToLogin' | t }}</a>
  </section>
</main>
