<app-auth-shell>
  <a class="ca-back" routerLink="/auth">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    {{ 'forgot.backToLogin' | t }}
  </a>

  <header class="ca-head">
    <span class="ca-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
    </span>
    <h1>{{ 'reset.title' | t }}</h1>
    <p>{{ 'reset.copy' | t }}</p>
  </header>

  <form class="ca-form" (ngSubmit)="resetPassword()" novalidate>
    @if (errorMessage) {
    <p class="ca-alert danger" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span>{{ errorMessage }}</span>
    </p>
    }

    @if (successMessage) {
    <p class="ca-alert success" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
      <span>{{ successMessage }}</span>
    </p>
    }

    @if (!token) {
    <div class="ca-field">
      <label for="reset-token">{{ 'reset.token' | t }}</label>
      <span class="ca-control">
        <svg class="ca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3"/></svg>
        <input id="reset-token" type="text" name="token" [(ngModel)]="token" autocomplete="off" required />
      </span>
    </div>
    }

    <div class="ca-field">
      <label for="reset-new">{{ 'reset.newPassword' | t }}</label>
      <span class="ca-control has-toggle">
        <svg class="ca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="reset-new" [type]="showPassword ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword"
          autocomplete="new-password" required />
        <button type="button" class="ca-eye" (click)="showPassword = !showPassword"
          [attr.aria-label]="(showPassword ? 'auth.hidePassword' : 'auth.showPassword') | t">
          @if (showPassword) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </span>
      <span class="ca-hint">{{ 'reset.tooShort' | t }}</span>
    </div>

    <div class="ca-field">
      <label for="reset-confirm">{{ 'reset.confirmPassword' | t }}</label>
      <span class="ca-control">
        <svg class="ca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="reset-confirm" [type]="showPassword ? 'text' : 'password'" name="confirmPassword"
          [(ngModel)]="confirmPassword" autocomplete="new-password" required />
      </span>
    </div>

    <button class="ca-submit" type="submit" [disabled]="loading">
      @if (loading) {
      <span class="ca-spinner" aria-hidden="true"></span>
      }
      {{ (loading ? 'reset.resetting' : 'reset.reset') | t }}
    </button>
  </form>
</app-auth-shell>
