<main class="register-page">
  <header class="register-topbar">
    <a class="register-brand" routerLink="/" aria-label="Reza accueil">
      <img class="register-brand__logo" src="assets/images/logo.png" alt="Reza" />
    </a>

    <nav class="register-nav" aria-label="Navigation principale">
      <a routerLink="/etablissementrecherche" [queryParams]="{ type: 'restaurant' }">Restaurants</a>
      <a routerLink="/etablissementrecherche" [queryParams]="{ type: 'soin' }">Beaute / Bien etre</a>
      <a routerLink="/etablissementrecherche" [queryParams]="{ type: 'activite' }">Activites</a>
    </nav>

    @if (isAuthenticated) {
      <a
        class="register-avatar"
        routerLink="/profile"
        aria-label="Mon compte"
        [style.background-image]="avatarStyle"
        [class.register-avatar--image]="!!avatarStyle"
      ></a>
    } @else {
      <div class="register-topbar__actions">
        <a class="register-topbar__pro" href="https://pro.booktareza.com/login">Je suis un professionnel</a>
        <a class="register-topbar__login" routerLink="/auth">Se connecter</a>
      </div>
    }
  </header>

  <section class="register-panel">
    <h1>Vous avez deja un compte Reza</h1>

    <form class="register-form">
      <div class="register-grid">
        <label class="register-field">
          <input type="text" placeholder="Nom" />
        </label>

        <label class="register-field">
          <input type="text" placeholder="Prenom" />
        </label>
      </div>

      <label class="register-field">
        <input type="tel" placeholder="Numero de telephone" />
      </label>

      <label class="register-field">
        <input type="email" placeholder="E-mail" />
      </label>

      <label class="register-field">
        <input type="password" placeholder="Mot de passe" />
      </label>

      <label class="register-check">
        <input type="checkbox" />
        <span>J'accepte les CGU de Reza</span>
      </label>

      <button class="register-button" type="button">S'inscrire</button>
    </form>

    <div class="register-divider" aria-hidden="true">
      <span></span>
      <strong>Ou</strong>
      <span></span>
    </div>

    <p class="register-footnote">Nouveau sur Reza ?</p>
  </section>
</main>
