<main class="register-page">
  <section class="register-panel">
    <h1 style="text-align: center;">{{ 'register.title' | t }}</h1>

    <form class="register-form" (ngSubmit)="register()">
      <div class="register-grid">
        <label class="register-field">
          <input type="text" name="nom" [(ngModel)]="nom" [placeholder]="'register.lastName' | t" required />
        </label>

        <label class="register-field">
          <input type="text" name="prenom" [(ngModel)]="prenom" [placeholder]="'register.firstName' | t" required />
        </label>
      </div>

      <label class="register-field">
        <input type="tel" name="phoneNumber" [(ngModel)]="phoneNumber" [placeholder]="'register.whatsapp' | t" required />
      </label>

      <label class="register-field">
        <input type="email" name="email" [(ngModel)]="email" [placeholder]="'auth.email' | t" required />
      </label>

      <div class="register-field register-field--password">
        <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
          [placeholder]="'auth.password' | t" required />
        <button type="button" class="register-field__toggle" (click)="showPassword = !showPassword"
          [attr.aria-label]="(showPassword ? 'auth.hidePassword' : 'auth.showPassword') | t">
          @if (showPassword) {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="register-field__toggle-icon">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
            </path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="register-field__toggle-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          }
        </button>
      </div>

      <div class="register-field register-field--password">
        <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword"
          [placeholder]="'register.confirmPassword' | t" required />
        <button type="button" class="register-field__toggle" (click)="showConfirmPassword = !showConfirmPassword"
          [attr.aria-label]="(showConfirmPassword ? 'register.hideConfirm' : 'register.showConfirm') | t">
          @if (showConfirmPassword) {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="register-field__toggle-icon">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
            </path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="register-field__toggle-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          }
        </button>
      </div>

      <label class="register-check">
        <input type="checkbox" name="cguChecked" [(ngModel)]="cguChecked" required />
        <a class="" href="https://booktareza.com/cgu/">{{ 'register.acceptCgu' | t }}</a>
      </label>

      @if (errorMessage) {
      <p class="register-error">{{ errorMessage }}</p>
      }

      @if (successMessage) {
      <p class="register-success">{{ successMessage }}</p>
      }

      <button class="register-button" type="submit" [disabled]="loading">
        {{ (loading ? 'register.registering' : 'auth.createAccount') | t }}
      </button>
    </form>

    <div class="register-divider" aria-hidden="true">
      <span></span>
      <strong>{{ 'common.or' | t }}</strong>
      <span></span>
    </div>

    <p class="register-footnote">{{ 'register.alreadyAccount' | t }}<a class="register-footnote__link"
        routerLink="/auth">{{ 'nav.login' | t }}</a></p>
  </section>
</main>
