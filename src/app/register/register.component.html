<main class="register-page">
  <header class="register-topbar">
    <a class="register-brand" routerLink="/" aria-label="Reza accueil">
      <img class="register-brand__logo" src="assets/images/logo.png" alt="Reza" />
    </a>

    <nav class="register-nav" aria-label="Navigation principale">
      <a routerLink="/etablissementrecherche" [queryParams]="{ type: 'restaurant' }" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'exact', matrixParams: 'ignored', fragment: 'ignored' }">Restaurants</a>
      <a routerLink="/etablissementrecherche" [queryParams]="{ type: 'soin' }" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'exact', matrixParams: 'ignored', fragment: 'ignored' }">Beauté / Bien être</a>
      <a routerLink="/etablissementrecherche" [queryParams]="{ type: 'activite' }" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'exact', matrixParams: 'ignored', fragment: 'ignored' }">Activitées</a>
    </nav>

    @if (isAuthenticated) {
      <a
        class="register-avatar"
        routerLink="/profile"
        aria-label="Mon compte"
        [style.background-image]="avatarStyle"
        [class.register-avatar--image]="!!avatarStyle"
      ></a>
    } @else {
      <div class="register-topbar__actions">
        <a class="register-topbar__pro" href="https://pro.booktareza.com/login">Je suis un professionnel</a>
        <a class="register-topbar__login" routerLink="/auth">Se connecter</a>
      </div>
    }
  </header>

  <section class="register-panel">
    <h1>Vous avez deja un compte Reza</h1>

    <form class="register-form" (ngSubmit)="register()">
      <div class="register-grid">
        <label class="register-field">
          <input type="text" name="nom" [(ngModel)]="nom" placeholder="Nom" required />
        </label>

        <label class="register-field">
          <input type="text" name="prenom" [(ngModel)]="prenom" placeholder="Prenom" required />
        </label>
      </div>

      <label class="register-field">
        <input type="tel" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="Numero de telephone" required />
      </label>

      <label class="register-field">
        <input type="email" name="email" [(ngModel)]="email" placeholder="E-mail" required />
      </label>

      <label class="register-field">
        <input type="password" name="password" [(ngModel)]="password" placeholder="Mot de passe" required />
      </label>

      <label class="register-check">
        <input type="checkbox" name="cguChecked" [(ngModel)]="cguChecked" required />
        <span>J'accepte les CGU de Reza</span>
      </label>

      @if (errorMessage) {
        <p class="register-error">{{ errorMessage }}</p>
      }

      @if (successMessage) {
        <p class="register-success">{{ successMessage }}</p>
      }

      <button class="register-button" type="submit" [disabled]="loading">
        {{ loading ? 'Inscription...' : "S'inscrire" }}
      </button>
    </form>

    <div class="register-divider" aria-hidden="true">
      <span></span>
      <strong>Ou</strong>
      <span></span>
    </div>

    <p class="register-footnote">Nouveau sur Reza ?</p>
  </section>
</main>
