<main class="reset-page">
  <section class="reset-panel">
    <h1>{{ 'forgot.title' | t }}</h1>
    <p class="reset-copy">{{ 'forgot.copy' | t }}</p>

    <form class="reset-form" (ngSubmit)="requestReset()">
      <label class="reset-field">
        <input type="email" name="email" [(ngModel)]="email" [placeholder]="'auth.email' | t" autocomplete="email" required />
      </label>

      @if (errorMessage) {
      <p class="reset-error">{{ errorMessage }}</p>
      }

      @if (successMessage) {
      <p class="reset-success">{{ successMessage }}</p>
      }

      <button class="reset-button" type="submit" [disabled]="loading">
        {{ (loading ? 'forgot.sending' : 'forgot.send') | t }}
      </button>
    </form>

    <a class="reset-link" routerLink="/auth">{{ 'forgot.backToLogin' | t }}</a>
  </section>
</main>
