<app-auth-shell>
  <a class="ca-back" routerLink="/auth">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    {{ 'forgot.backToLogin' | t }}
  </a>

  <header class="ca-head">
    <span class="ca-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2 2"/></svg>
    </span>
    <h1>{{ 'forgot.title' | t }}</h1>
    <p>{{ 'forgot.copy' | t }}</p>
  </header>

  <form class="ca-form" (ngSubmit)="requestReset()" novalidate>
    @if (errorMessage) {
    <p class="ca-alert danger" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span>{{ errorMessage }}</span>
    </p>
    }

    @if (successMessage) {
    <p class="ca-alert success" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
      <span>{{ successMessage }}</span>
    </p>
    }

    <div class="ca-field">
      <label for="forgot-email">{{ 'auth.email' | t }}</label>
      <span class="ca-control">
        <svg class="ca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input id="forgot-email" type="email" name="email" [(ngModel)]="email" placeholder="vous@exemple.com"
          autocomplete="email" inputmode="email" required />
      </span>
    </div>

    <button class="ca-submit" type="submit" [disabled]="loading">
      @if (loading) {
      <span class="ca-spinner" aria-hidden="true"></span>
      }
      {{ (loading ? 'forgot.sending' : 'forgot.send') | t }}
    </button>
  </form>
</app-auth-shell>
