# 1 for extension-less page URLs when the visitor chose a non-default language.
map "$cookie_reza_lang:$uri" $reza_lang_ssr {
    default 0;
    # Every non-French code from src/i18n/languages.ts — keep in sync when adding a language.
    "~^(en|ar|es|pt|de|tr|id|zh|ja|hi|ru):[^.]*$" 1;
}

# Short-lived cache for SSR output. A single Node process renders ~20 pages/s, so under
# load every uncached /reservation/:slug or non-French render queues behind the others
# (load test: SSR p95 went 0.1s -> 8s between 100 and 500 concurrent users). The rendered
# HTML only varies by URL and the reza_lang cookie — the session lives client-side — so
# it's safe to share between visitors for a few seconds.
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:10m max_size=200m inactive=10m use_temp_path=off;

# Normalized language for the cache key, so junk cookie values can't fragment the cache
# (server.ts falls back to French for anything it doesn't recognize).
map $cookie_reza_lang $reza_lang_key {
    default fr;
    "~^(en|ar|es|pt|de|tr|id|zh|ja|hi|ru)$" $cookie_reza_lang;
}

server {
    listen 80;
    server_name ${CANONICAL_HOST};

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # This image is deployed to more than one environment (prod, dev), each with its own
    # canonical hostname — CANONICAL_HOST is set per-deployment (e.g. client.booktareza.com
    # for prod), not hardcoded, so a request that already arrived on the right host for its
    # own environment is never redirected away to a different environment's domain.
    # Neither users nor crawlers should see content served from a raw IP/run.app-style URL
    # once a real canonical hostname exists for that environment, so anything else still
    # gets sent there permanently.
    if ($host != "${CANONICAL_HOST}") {
        return 301 https://${CANONICAL_HOST}$request_uri;
    }

    location /api/reza/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        # $proxy_host (the backend's own hostname, e.g. reza_backend:8080) used to be sent
        # here instead of $host. Docker service names containing an underscore aren't valid
        # RFC-1123 hostnames, and newer Tomcat/Spring Boot versions strictly validate the Host
        # header, rejecting it with a bare 400 before the request ever reaches the app. Sending
        # the original client host instead avoids that — same value prod's own separate
        # host-nginx already forwards for /api/, which is why this only ever surfaced where
        # nothing else fronts this container's own proxy rule.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    location = /api/reza {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        # See the /api/reza/ block above re: $host vs $proxy_host.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    location / {
        # Prerendered pages are French; visitors who picked another language
        # (reza_lang cookie) get a fresh SSR render of page routes instead.
        error_page 418 = @ssr;
        if ($reza_lang_ssr) {
            return 418;
        }

        # $uri/index.html (a plain file candidate) instead of the $uri/
        # directory-match token, which would 301-redirect e.g. /recherche
        # to /recherche/ before serving it.
        try_files $uri $uri/index.html @ssr;
    }

    # Dynamic pages (e.g. /reservation/:slug) aren't in the prerendered
    # static build, so they're rendered on the fly by the Angular Universal
    # Node server running alongside nginx in this container.
    location @ssr {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # See proxy_cache_path above. Responses carrying Set-Cookie or Cache-Control
        # private/no-store are never cached (nginx default). On expiry, one request
        # re-renders in the background while the rest keep getting the stale copy,
        # and stale pages are also served if Node is down or erroring.
        proxy_cache ssr_cache;
        proxy_cache_key "$scheme$host$request_uri|$reza_lang_key";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
