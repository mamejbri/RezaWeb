server {
    listen 80;
    server_name ${CANONICAL_HOST};

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # This image is deployed to more than one environment (prod, dev), each with its own
    # canonical hostname — CANONICAL_HOST is set per-deployment (e.g. client.booktareza.com
    # for prod), not hardcoded, so a request that already arrived on the right host for its
    # own environment is never redirected away to a different environment's domain.
    # Neither users nor crawlers should see content served from a raw IP/run.app-style URL
    # once a real canonical hostname exists for that environment, so anything else still
    # gets sent there permanently.
    if ($host != "${CANONICAL_HOST}") {
        return 301 https://${CANONICAL_HOST}$request_uri;
    }

    location /api/reza/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        # $proxy_host (the backend's own hostname, e.g. reza_backend:8080) used to be sent
        # here instead of $host. Docker service names containing an underscore aren't valid
        # RFC-1123 hostnames, and newer Tomcat/Spring Boot versions strictly validate the Host
        # header, rejecting it with a bare 400 before the request ever reaches the app. Sending
        # the original client host instead avoids that — same value prod's own separate
        # host-nginx already forwards for /api/, which is why this only ever surfaced where
        # nothing else fronts this container's own proxy rule.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    location = /api/reza {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        # See the /api/reza/ block above re: $host vs $proxy_host.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    location / {
        # $uri/index.html (a plain file candidate) instead of the $uri/
        # directory-match token, which would 301-redirect e.g. /recherche
        # to /recherche/ before serving it.
        try_files $uri $uri/index.html @ssr;
    }

    # Dynamic pages (e.g. /reservation/:slug) aren't in the prerendered
    # static build, so they're rendered on the fly by the Angular Universal
    # Node server running alongside nginx in this container.
    location @ssr {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
