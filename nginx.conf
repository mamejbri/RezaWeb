server {
    listen 80;
    server_name client.booktareza.com;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Cloud Run always exposes the service on its own *.run.app hostname in
    # addition to the mapped custom domain. Neither users nor crawlers should
    # ever see content served from the raw run.app URL, so send anything not
    # requested via the canonical hostname there permanently.
    if ($host != "client.booktareza.com") {
        return 301 https://client.booktareza.com$request_uri;
    }

    location /api/reza/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    location = /api/reza {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    location / {
        # $uri/index.html (a plain file candidate) instead of the $uri/
        # directory-match token, which would 301-redirect e.g. /recherche
        # to /recherche/ before serving it.
        try_files $uri $uri/index.html @ssr;
    }

    # Dynamic pages (e.g. /reservation/:slug) aren't in the prerendered
    # static build, so they're rendered on the fly by the Angular Universal
    # Node server running alongside nginx in this container.
    location @ssr {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
