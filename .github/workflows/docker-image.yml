name: Docker Image

on:
  push:
    branches:
      - master
      - main
      - dev # builds ghcr.io/mamejbri/reza_web_client:dev for the dev VM
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mamejbri/reza_web_client

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The image alone changed nothing: the VMs kept running the old container. Each push now
  # recreates reza_web_client on its VM (dev -> reza-dev, master -> reza-prod) with the new image.
  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name == 'master' && 'latest' || 'dev' }}
      CANONICAL_HOST: ${{ github.ref_name == 'master' && 'client.booktareza.com' || '34.77.209.65' }}
      VM_IP: ${{ github.ref_name == 'master' && secrets.PROD_GCP_VM_IP || secrets.DEV_GCP_VM_IP }}
      VM_USER: ${{ github.ref_name == 'master' && secrets.PROD_GCP_VM_USER || secrets.DEV_GCP_VM_USER }}
      VM_SSH_KEY: ${{ github.ref_name == 'master' && secrets.PROD_GCP_VM_SSH_KEY || secrets.DEV_GCP_VM_SSH_KEY }}

    steps:
      - name: Check the VM secrets are set
        run: |
          if [ -z "$VM_IP" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "::error::Add the ${{ github.ref_name == 'master' && 'PROD' || 'DEV' }}_GCP_VM_IP / _USER / _SSH_KEY secrets to this repository (the same as reza_backend's)."
            exit 1
          fi

      - name: Recreate reza_web_client on the VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ env.VM_SSH_KEY }}
          envs: TAG,CANONICAL_HOST
          script: |
            set -e
            DOCKER="docker"; $DOCKER ps >/dev/null 2>&1 || DOCKER="sudo docker"
            IMG="${{ env.IMAGE_NAME }}:$TAG"

            $DOCKER pull -q "$IMG"
            $DOCKER rm -f reza_web_client >/dev/null 2>&1 || true
            $DOCKER run -d --name reza_web_client --network reza_network -p 3001:80 --restart unless-stopped \
              -e BACKEND_URL=http://reza_backend:8080 -e CANONICAL_HOST="$CANONICAL_HOST" -e SSR_PORT=4000 \
              "$IMG"

            sleep 15
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $CANONICAL_HOST" http://localhost:3001/)
            echo "reza_web_client answers $code"
            [ "$code" = 200 ]
            $DOCKER image prune -f >/dev/null
